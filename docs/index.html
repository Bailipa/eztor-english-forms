<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>EZTor English Forms Demo</title>
<style>body{font:16px system-ui;max-width:720px;margin:40px auto;padding:0 20px;color:#17202a}input{padding:10px;width:100%;box-sizing:border-box;margin:8px 0;border:1px solid #cbd5e1;border-radius:8px}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font:inherit}pre{background:#f3f4f6;padding:16px;border-radius:10px;white-space:pre-wrap}</style>
<h1>EZTor English Forms</h1><p>Explore irregular forms and answer matching for vocabulary exercises.</p><input id="target" value="write" placeholder="Target word"><input id="answer" value="written" placeholder="Learner answer"><button onclick="run()">Check answer</button><pre id="out"></pre><p><a href="https://github.com/Bailipa/eztor-english-forms">View source on GitHub</a></p>
<script>const verbs={write:['write','wrote','written'],go:['go','went','gone'],take:['take','took','taken'],be:['be','is','am','are','was','were','been'],see:['see','saw','seen'],child:['child','children']};function run(){let t=document.getElementById('target').value.trim().toLowerCase(),a=document.getElementById('answer').value.trim().toLowerCase(),forms=verbs[t]||[t],ok=forms.includes(a)||(a.startsWith(t)&&/^[a-z]+$/.test(a));document.getElementById('out').textContent=JSON.stringify({target:t,acceptedForms:forms,answer:a,correct:ok},null,2)}run()</script>
